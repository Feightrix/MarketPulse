name: MarketPulse Phase 5B Consistency Tournament

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase5b_consistency_tournament.py'
      - '.github/workflows/phase5b-consistency.yml'

concurrency:
  group: marketpulse-phase5b
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas yfinance

      - name: Syntax check Phase 5B
        run: python -m py_compile phase5b_consistency_tournament.py

      - name: Run Phase 5B long-history tournament
        run: python phase5b_consistency_tournament.py

      - name: Commit Phase 5B research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase5b_results.json phase5b_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 5B consistency tournament results"
            git push
          fi
