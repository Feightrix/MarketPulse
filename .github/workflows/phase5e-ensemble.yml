name: MarketPulse Phase 5E Momentum Reversal Ensemble

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase5e_ensemble.py'
      - '.github/workflows/phase5e-ensemble.yml'

concurrency:
  group: marketpulse-phase5e
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Syntax check Phase 5E
        run: python -m py_compile phase5e_ensemble.py
      - name: Run Phase 5E historical research
        run: python phase5e_ensemble.py
      - name: Commit Phase 5E research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase5e_results.json phase5e_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 5E momentum reversal ensemble results"
            git push
          fi
