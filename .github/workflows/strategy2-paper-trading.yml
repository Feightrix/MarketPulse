name: MarketPulse Strategy 2 Exact Control Inverse Shadow

on:
  push:
    branches: [main]
    paths:
      - strategy2_inverse_shadow.py
      - .github/workflows/strategy2-paper-trading.yml
  workflow_dispatch:
  schedule:
    # Same observation cadence as before: 11:10 AM EDT / 10:10 AM EST weekdays.
    - cron: '10 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: strategy2-exact-inverse-shadow
  cancel-in-progress: false

jobs:
  strategy2-inverse-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Security check — exact inverse shadow, no broker orders
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('strategy2_inverse_shadow.py').read_text()
          core = Path('phase6b_paper_trader.py').read_text()
          assert 'EXACT_CONTROL_INVERSE_SHADOW' in s
          assert 'synthetic_fractional_short_shadow' in s
          assert 'return {s: -float(w)' in s
          assert 'ALPACA_STRATEGY2_API_KEY_ID' in s
          assert 'ALPACA_STRATEGY2_SECRET_KEY' in s
          assert 'core.api("POST"' not in s
          assert 'core.api("DELETE"' not in s
          assert 'submit_market' not in s
          assert 'close_position' not in s
          assert 'PAPER_BASE = "https://paper-api.alpaca.markets"' in core
          print('Strategy 2 exact inverse shadow invariants: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile strategy2_inverse_shadow.py

      - name: Run exact inverse shadow
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_inverse_shadow.py

      - name: Commit Strategy 2 inverse status and state
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/strategy2-inverse-output
          for f in strategy2_status.json strategy2_status.md strategy2_inverse_state.json strategy2_inverse_log.jsonl; do
            if [ -f "$f" ]; then cp "$f" "/tmp/strategy2-inverse-output/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_status.json strategy2_status.md strategy2_inverse_state.json strategy2_inverse_log.jsonl; do
            if [ -f "/tmp/strategy2-inverse-output/$f" ]; then
              cp "/tmp/strategy2-inverse-output/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Strategy 2 inverse state changes"
          else
            git commit -m "Update Strategy 2 exact inverse shadow"
            git push origin main
          fi
