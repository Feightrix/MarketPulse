name: MarketPulse Strategy 2 Risk Cap 57.5 Shadow

on:
  push:
    branches: [main]
    paths:
      - strategy2_riskcap575_shadow.py
      - .github/workflows/strategy2-paper-trading.yml
  workflow_dispatch:
  schedule:
    # Five minutes after frozen Strategy 1 Control.
    - cron: '10 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: strategy2-riskcap575-shadow
  cancel-in-progress: false

jobs:
  strategy2-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Security and experiment invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('strategy2_riskcap575_shadow.py').read_text()
          core = Path('phase6b_paper_trader.py').read_text()
          assert 'CONTROL_CLONE_RISK_CAP_57_5' in s
          assert 'RISK_CAP = 0.575' in s
          assert 'profit_lock_active": False' in s
          assert 'pyramiding_active": False' in s
          assert 'ALPACA_STRATEGY2_API_KEY_ID' in s
          assert 'ALPACA_STRATEGY2_SECRET_KEY' in s
          assert 'core.api("POST"' not in s
          assert 'core.api("DELETE"' not in s
          assert 'submit_market' not in s
          assert 'close_position' not in s
          assert 'PAPER_BASE = "https://paper-api.alpaca.markets"' in core
          print('Strategy 2 57.5% risk-cap shadow invariants: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile strategy2_riskcap575_shadow.py

      - name: Run Strategy 2 shadow
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_riskcap575_shadow.py

      - name: Commit Strategy 2 status and state
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/strategy2-riskcap575-output
          for f in strategy2_status.json strategy2_status.md strategy2_riskcap575_state.json strategy2_riskcap575_log.jsonl; do
            if [ -f "$f" ]; then cp "$f" "/tmp/strategy2-riskcap575-output/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_status.json strategy2_status.md strategy2_riskcap575_state.json strategy2_riskcap575_log.jsonl; do
            if [ -f "/tmp/strategy2-riskcap575-output/$f" ]; then
              cp "/tmp/strategy2-riskcap575-output/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Strategy 2 risk-cap state changes"
          else
            git commit -m "Update Strategy 2 57.5% risk-cap shadow"
            git push origin main
          fi
