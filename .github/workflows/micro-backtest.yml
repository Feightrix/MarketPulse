name: MarketPulse Micro Backtest

# Market Data auth is required for historical validation. Paper Trading auth is checked but does not block the backtest.
on:
  workflow_dispatch:
  push:
    paths:
      - 'micro_backtest_v2.py'
      - 'micro_backtest_v3.py'
      - '.github/workflows/micro-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Validate Alpaca credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          headers={
              'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY_ID'],
              'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET_KEY'],
          }
          tests=[
              ('Paper Trading API','https://paper-api.alpaca.markets/v2/account',False),
              ('Market Data API','https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Day&start=2026-08-01T00%3A00%3A00Z&end=2026-08-05T00%3A00%3A00Z&feed=iex&limit=1',True),
          ]
          hard_fail=False
          for name,url,required in tests:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      r.read()
                      print(f'{name}: AUTH OK ({r.status})')
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')[:500]
                  level='ERROR' if required else 'WARNING'
                  print(f'{name}: {level} HTTP {e.code}: {body}')
                  if required:
                      hard_fail=True
              except Exception as e:
                  level='ERROR' if required else 'WARNING'
                  print(f'{name}: {level}: {type(e).__name__}: {e}')
                  if required:
                      hard_fail=True
          if hard_fail:
              raise SystemExit(2)
          PY

      - name: Run MarketPulse Micro validation
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python micro_backtest_v3.py

      - name: Commit validation results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add micro_backtest_results.json micro_backtest_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update MarketPulse Micro validation results"
            git push
          fi
