name: MarketPulse Options Pattern 1 Refinement

on:
  push:
    branches: [main]
    paths:
      - options_pattern1_refinement.py
      - options_pattern1_geometry.py
      - options_pattern1_geometry_eval.py
      - .github/workflows/options-pattern1-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-pattern1-refinement
  cancel-in-progress: false

jobs:
  refine-pattern1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern1_backtest.py').read_text()
          ref = Path('options_pattern1_refinement.py').read_text()
          geo = Path('options_pattern1_geometry.py').read_text()
          ge = Path('options_pattern1_geometry_eval.py').read_text()
          assert 'ALPACA_OPTIONS_API_KEY_ID' in base
          assert 'https://data.alpaca.markets' in base
          assert 'order_submission_enabled' in ref
          assert 'order_submission_enabled' in geo
          assert 'order_submission_enabled' in ge
          assert 'paper-api.alpaca.markets/v2/orders' not in geo + ge
          assert 'api.alpaca.markets/v2/orders' not in geo + ge
          assert 'TARGET_R = 1.5' in geo
          print('Pattern 1 refinement + geometry research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern1_backtest.py
          python -m py_compile options_pattern1_refinement.py
          python -m py_compile options_pattern1_geometry.py
          python -m py_compile options_pattern1_geometry_eval.py

      - name: Run Pattern 1 refinement
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern1_refinement.py

      - name: Validate refinement result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern1_refinement_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern1_refinement'
          assert result['complete_sessions'] > 20
          print('REFINEMENT HOLDOUT', json.dumps(result['holdout'], indent=2))
          print('REFINEMENT FULL', json.dumps(result['full_sample'], indent=2))
          PY

      - name: Run entry stop geometry evaluation
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern1_geometry_eval.py

      - name: Validate geometry result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern1_geometry_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern1_entry_stop_geometry'
          assert result['target_r'] == 1.5
          assert result['complete_sessions'] > 20
          print('GEOMETRY FOLD A', json.dumps(result['fold_a'], indent=2))
          print('GEOMETRY FOLD B', json.dumps(result['fold_b'], indent=2))
          print('GEOMETRY HOLDOUT', json.dumps(result['holdout'], indent=2))
          print('GEOMETRY FULL', json.dumps(result['full_sample'], indent=2))
          print('REPLACE LEADER', result['replace_prior_leader'])
          PY

      - name: Commit research results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-pattern1-research
          for f in options_pattern1_refinement_results.json options_pattern1_refinement_results.md options_pattern1_geometry_results.json options_pattern1_geometry_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-pattern1-research/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern1_refinement_results.json options_pattern1_refinement_results.md options_pattern1_geometry_results.json options_pattern1_geometry_results.md; do
            if [ -f "/tmp/options-pattern1-research/$f" ]; then
              cp "/tmp/options-pattern1-research/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Pattern 1 research result changes"
          else
            git commit -m "Update Options Pattern 1 geometry research"
            git push origin main
          fi
