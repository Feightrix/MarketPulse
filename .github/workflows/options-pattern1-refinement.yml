name: MarketPulse Options Research

on:
  push:
    branches: [main]
    paths:
      - options_pattern2_contract_gate.py
      - .github/workflows/options-pattern1-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-research
  cancel-in-progress: false

jobs:
  options-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          gate = Path('options_pattern2_contract_gate.py').read_text()
          ab = Path('options_pattern2_contract_ab.py').read_text()
          assert 'order_submission_enabled' in gate
          assert 'POLICY_NAME = "itm_4d_delta60"' in gate
          assert 'GATES = [' in gate
          assert '/v2/options/contracts' in ab
          assert '/v1beta1/options/bars' in ab
          assert 'paper-api.alpaca.markets/v2/orders' not in gate + ab
          assert 'api.alpaca.markets/v2/orders' not in gate + ab
          print('Pattern 2 contract execution-gate research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern1_backtest.py
          python -m py_compile options_pattern2_vwap_reversion.py
          python -m py_compile options_pattern2_trend_refinement.py
          python -m py_compile options_pattern2_contract_sim.py
          python -m py_compile options_pattern2_contract_ab.py
          python -m py_compile options_pattern2_contract_gate.py

      - name: Run Pattern 2 contract execution gate
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern2_contract_gate.py

      - name: Validate execution gate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern2_contract_gate_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern2_contract_execution_gate'
          assert result['signals_generated'] > 20
          assert result['contracts_simulated'] > 20
          assert len(result['gates_predeclared']) == 12
          base = result['baseline']['full']
          assert abs(base['net_pl_dollars'] - 183.78) <= 5.0, base
          print('BASELINE', json.dumps(result['baseline'], indent=2))
          print('ELIGIBLE DEV GATES', result['eligible_on_development_only'])
          print('SELECTED', json.dumps(result['selected_development_gate'], indent=2))
          print('EXTERNAL CONFIRMATION', result['external_confirmation_pass'])
          print('PROMOTED', json.dumps(result['promoted_gate'], indent=2))
          PY

      - name: Commit execution gate results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-research
          for f in options_pattern2_contract_gate_results.json options_pattern2_contract_gate_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-research/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern2_contract_gate_results.json options_pattern2_contract_gate_results.md; do
            if [ -f "/tmp/options-research/$f" ]; then
              cp "/tmp/options-research/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No execution gate result changes"
          else
            git commit -m "Update Pattern 2 contract execution gate results"
            git push origin main
          fi
