name: MarketPulse Options Research

on:
  push:
    branches: [main]
    paths:
      - options_pattern1_refinement.py
      - options_pattern2_vwap_reversion.py
      - options_pattern2_trend_refinement.py
      - options_pattern2_external_validation.py
      - options_pattern2_contract_sim.py
      - .github/workflows/options-pattern1-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-research
  cancel-in-progress: false

jobs:
  options-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern1_backtest.py').read_text()
          files = [
              Path('options_pattern1_refinement.py').read_text(),
              Path('options_pattern2_vwap_reversion.py').read_text(),
              Path('options_pattern2_trend_refinement.py').read_text(),
              Path('options_pattern2_external_validation.py').read_text(),
              Path('options_pattern2_contract_sim.py').read_text(),
          ]
          assert 'ALPACA_OPTIONS_API_KEY_ID' in base
          assert 'https://data.alpaca.markets' in base
          for text in files:
              assert 'order_submission_enabled' in text or 'RESULT_JSON' in text
              assert 'paper-api.alpaca.markets/v2/orders' not in text
              assert 'api.alpaca.markets/v2/orders' not in text
          contract = Path('options_pattern2_contract_sim.py').read_text()
          assert '/v2/options/contracts' in contract
          assert '/v1beta1/options/bars' in contract
          assert 'options_pattern2_real_contract_sim' in contract
          print('Options contract simulation research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern1_backtest.py
          python -m py_compile options_pattern1_refinement.py
          python -m py_compile options_pattern2_vwap_reversion.py
          python -m py_compile options_pattern2_trend_refinement.py
          python -m py_compile options_pattern2_external_validation.py
          python -m py_compile options_pattern2_contract_sim.py

      - name: Run Pattern 2 real options contract simulation
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern2_contract_sim.py

      - name: Validate real options result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern2_contract_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern2_real_contract_sim'
          assert result['signals_generated'] > 20
          assert result['contracts_simulated'] > 0
          print('FULL OPTIONS', json.dumps(result['full_option_sim'], indent=2))
          print('OLDER OPTIONS', json.dumps(result['older_external_block'], indent=2))
          print('RECENT OPTIONS', json.dumps(result['recent_block'], indent=2))
          print('CALLS', json.dumps(result['direction_split']['calls'], indent=2))
          print('PUTS', json.dumps(result['direction_split']['puts'], indent=2))
          print('FILL MODES', json.dumps(result['fill_modes'], indent=2))
          print('SKIPS', json.dumps(result['skip_reasons'], indent=2))
          PY

      - name: Commit contract simulation
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-research
          for f in options_pattern2_contract_results.json options_pattern2_contract_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-research/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern2_contract_results.json options_pattern2_contract_results.md; do
            if [ -f "/tmp/options-research/$f" ]; then
              cp "/tmp/options-research/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No contract simulation changes"
          else
            git commit -m "Update Pattern 2 real options contract simulation"
            git push origin main
          fi