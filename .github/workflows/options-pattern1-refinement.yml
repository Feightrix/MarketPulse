name: MarketPulse Options Research

on:
  push:
    branches: [main]
    paths:
      - options_pattern1_refinement.py
      - options_pattern2_vwap_reversion.py
      - options_pattern2_trend_refinement.py
      - .github/workflows/options-pattern1-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-research
  cancel-in-progress: false

jobs:
  options-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern1_backtest.py').read_text()
          p1 = Path('options_pattern1_refinement.py').read_text()
          p2 = Path('options_pattern2_vwap_reversion.py').read_text()
          p2t = Path('options_pattern2_trend_refinement.py').read_text()
          assert 'ALPACA_OPTIONS_API_KEY_ID' in base
          assert 'https://data.alpaca.markets' in base
          for text in (p1, p2, p2t):
              assert 'order_submission_enabled' in text
              assert 'paper-api.alpaca.markets/v2/orders' not in text
              assert 'api.alpaca.markets/v2/orders' not in text
          print('Options research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern1_backtest.py
          python -m py_compile options_pattern1_refinement.py
          python -m py_compile options_pattern2_vwap_reversion.py
          python -m py_compile options_pattern2_trend_refinement.py

      - name: Run Pattern 1 leader refresh
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern1_refinement.py

      - name: Run Pattern 2 baseline
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern2_vwap_reversion.py

      - name: Run Pattern 2 trend robustness validation
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern2_trend_refinement.py

      - name: Validate Pattern 2 trend result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern2_trend_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern2_trend_refinement'
          assert result['complete_sessions'] > 100
          print('DEVELOPMENT FOLDS', json.dumps(result['development_folds'], indent=2))
          print('UNSEEN OLDER VALIDATION', json.dumps(result['unseen_older_validation'], indent=2))
          print('FULL 360', json.dumps(result['full_360'], indent=2))
          print('CALLS', json.dumps(result['direction_split_full']['calls'], indent=2))
          print('PUTS', json.dumps(result['direction_split_full']['puts'], indent=2))
          PY

      - name: Commit research results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-research
          for f in options_pattern1_refinement_results.json options_pattern1_refinement_results.md options_pattern2_results.json options_pattern2_results.md options_pattern2_trend_results.json options_pattern2_trend_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-research/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern1_refinement_results.json options_pattern1_refinement_results.md options_pattern2_results.json options_pattern2_results.md options_pattern2_trend_results.json options_pattern2_trend_results.md; do
            if [ -f "/tmp/options-research/$f" ]; then
              cp "/tmp/options-research/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No options research result changes"
          else
            git commit -m "Update Pattern 2 trend robustness research"
            git push origin main
          fi
