name: MarketPulse Options Research

on:
  push:
    branches: [main]
    paths:
      - options_pattern1_refinement.py
      - options_pattern2_vwap_reversion.py
      - options_pattern2_trend_refinement.py
      - options_pattern2_external_validation.py
      - .github/workflows/options-pattern1-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-research
  cancel-in-progress: false

jobs:
  options-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern1_backtest.py').read_text()
          files = [
              Path('options_pattern1_refinement.py').read_text(),
              Path('options_pattern2_vwap_reversion.py').read_text(),
              Path('options_pattern2_trend_refinement.py').read_text(),
              Path('options_pattern2_external_validation.py').read_text(),
          ]
          assert 'ALPACA_OPTIONS_API_KEY_ID' in base
          assert 'https://data.alpaca.markets' in base
          for text in files:
              assert 'order_submission_enabled' in text
              assert 'paper-api.alpaca.markets/v2/orders' not in text
              assert 'api.alpaca.markets/v2/orders' not in text
          print('Options research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern1_backtest.py
          python -m py_compile options_pattern1_refinement.py
          python -m py_compile options_pattern2_vwap_reversion.py
          python -m py_compile options_pattern2_trend_refinement.py
          python -m py_compile options_pattern2_external_validation.py

      - name: Run frozen Pattern 2 external validation
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern2_external_validation.py

      - name: Validate external result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern2_external_validation.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern2_fixed_external_validation'
          assert result['external_sessions'] > 50
          print('EXTERNAL', json.dumps(result['external_unseen_block'], indent=2))
          print('FIRST HALF', json.dumps(result['external_first_half'], indent=2))
          print('SECOND HALF', json.dumps(result['external_second_half'], indent=2))
          print('CALLS', json.dumps(result['direction_split_external']['calls'], indent=2))
          print('PUTS', json.dumps(result['direction_split_external']['puts'], indent=2))
          PY

      - name: Commit external validation
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-research
          for f in options_pattern2_external_validation.json options_pattern2_external_validation.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-research/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern2_external_validation.json options_pattern2_external_validation.md; do
            if [ -f "/tmp/options-research/$f" ]; then
              cp "/tmp/options-research/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No external validation changes"
          else
            git commit -m "Update Pattern 2 external validation"
            git push origin main
          fi
