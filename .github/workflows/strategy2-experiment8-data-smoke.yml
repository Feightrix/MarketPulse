name: Experiment 8 Historical Data Smoke

on:
  push:
    branches: [main]
    paths:
      - strategy2_experiment8_data_smoke.py
      - .github/workflows/strategy2-experiment8-data-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Run data smoke
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment8_data_smoke.py
      - name: Commit diagnostic
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy2_experiment8_data_smoke.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Experiment 8 data smoke"
          git push origin main
