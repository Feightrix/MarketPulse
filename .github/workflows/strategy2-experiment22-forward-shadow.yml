name: Strategy 2 Experiment 22 Forward Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - strategy2_experiment22_forward_shadow.py
      - .github/workflows/strategy2-experiment22-forward-shadow.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment22-forward-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify forward shadow lock
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment22_forward_shadow.py').read_text()
          assert 'EXPERIMENT = "S2-E22-EARLY-TURN-FORWARD-SHADOW"' in s
          assert 'BROKER_ORDERS = False' in s and 'LIVE_TRADING_LOCKED = True' in s
          assert 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'FORWARD_MIN_TRADES = 15' in s
          assert 'FORWARD_MIN_PROFIT_FACTOR = 1.30' in s
          assert 'FORWARD_MAX_DRAWDOWN_PCT = 5.0' in s
          assert 'FEED = "sip"' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 22 forward shadow invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py strategy2_experiment18_volatile_leader_trendday.py strategy2_experiment20_exceptional_runner.py strategy2_experiment22_exceptional_runner_early_turn.py strategy2_experiment22_forward_shadow.py
      - name: Replay today's frozen signal after close
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment22_forward_shadow.py
      - name: Commit forward shadow log
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e22f
          for f in strategy2_experiment22_forward_shadow_log.json strategy2_experiment22_forward_shadow_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e22f/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment22_forward_shadow_log.json strategy2_experiment22_forward_shadow_summary.md; do
            if [ -f "/tmp/s2e22f/$f" ]; then cp "/tmp/s2e22f/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Experiment 22 forward shadow session"
          git push origin main
