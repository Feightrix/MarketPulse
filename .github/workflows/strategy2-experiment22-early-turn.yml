name: Strategy 2 Experiment 22 Early Turn

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment22_exceptional_runner_early_turn.py
      - .github/workflows/strategy2-experiment22-early-turn.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment22-early-turn
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment22_exceptional_runner_early_turn.py').read_text()
          assert 'EXPERIMENT = "S2-E22-EXCEPTIONAL-RUNNER-EARLY-TURN"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'MIN_PULLBACK_FRACTION = 0.10' in s
          assert 'MAX_PULLBACK_FRACTION = 0.45' in s
          assert 'PULLBACK_VOLUME_CONTRACTION_MAX = 0.85' in s
          assert 'BUYER_VOLUME_REEXPANSION_MIN = 1.10' in s
          assert 'MIN_TURN_CLOSE_LOCATION = 0.70' in s
          assert 'exceptional_gate": "Experiment 20 unchanged"' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 22 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py strategy2_experiment18_volatile_leader_trendday.py strategy2_experiment20_exceptional_runner.py strategy2_experiment22_exceptional_runner_early_turn.py
      - name: Run nonblind 2026 sanity backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment22_exceptional_runner_early_turn.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e22
          for f in strategy2_experiment22_exceptional_runner_early_turn_results.json strategy2_experiment22_exceptional_runner_early_turn_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e22/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment22_exceptional_runner_early_turn_results.json strategy2_experiment22_exceptional_runner_early_turn_summary.md; do
            if [ -f "/tmp/s2e22/$f" ]; then cp "/tmp/s2e22/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record exceptional runner early-turn development results"
          git push origin main
