name: Historical News Momentum Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [strategy2_experiment8_news_momentum_long.py]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify research-only code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment8_news_momentum_long.py').read_text()
          assert 'broker_orders": False' in s
          assert 'long_only": True' in s
          assert 'leverage": False' in s
          assert '/v2/orders' not in s
          assert 'paper-api.alpaca.markets' not in s
          assert 'COST_BPS_PER_FILL = 10.0' in s
          python_ok=True
          print('Research-only invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment8_news_momentum_long.py
      - name: Run backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment8_news_momentum_long.py
      - name: Commit results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy2_experiment8_news_momentum_results.json strategy2_experiment8_news_momentum_summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record news momentum results"
          git push origin main
