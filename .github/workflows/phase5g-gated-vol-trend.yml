name: MarketPulse Phase 5G Gated Vol Trend

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase5g_gated_vol_trend.py'
      - '.github/workflows/phase5g-gated-vol-trend.yml'

concurrency:
  group: marketpulse-phase5g
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Syntax check Phase 5G
        run: python -m py_compile phase5g_gated_vol_trend.py
      - name: Run Phase 5G historical research
        run: python phase5g_gated_vol_trend.py
      - name: Commit Phase 5G research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase5g_results.json phase5g_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 5G gated volatility trend results"
            git push
          fi
