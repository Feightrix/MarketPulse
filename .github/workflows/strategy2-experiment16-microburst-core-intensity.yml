name: Strategy 2 Experiment 16 MicroBurst Core Intensity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment16_microburst_core_intensity.py
      - .github/workflows/strategy2-experiment16-microburst-core-intensity.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment16-microburst-core-intensity
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked research protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment16_microburst_core_intensity.py').read_text()
          assert 'EXPERIMENT = "S2-E16-MICROBURST-CORE-INTENSITY-V3"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          assert 'TEST_DATES = ["2026-08-05", "2026-08-06", "2026-08-07", "2026-08-10", "2026-08-11"]' in s
          assert 'MIN_QUOTE_IMBALANCE = 0.35' in s
          assert 'MIN_MICRO_DISP_BPS = 0.15' in s
          assert 'MIN_BUY_IMBALANCE = 0.35' in s
          assert 'MIN_TRADE_ACCEL = 1.20' in s
          assert 'MIN_QUOTE_ACCEL = 1.00' in s
          assert 'MIN_ASK_DEPLETION = 0.20' in s
          assert 'MIN_INTENSITY_CONFIRMATIONS = 1' in s
          assert 'HORIZON_SECONDS = v1.HORIZON_SECONDS' in s
          assert 'PROFIT_BPS = v1.PROFIT_BPS' in s and 'STOP_BPS = v1.STOP_BPS' in s
          assert 'IMPACT_BPS_PER_SIDE = v1.IMPACT_BPS_PER_SIDE' in s
          assert 'MAX_NOTIONAL_PCT = v1.MAX_NOTIONAL_PCT' in s
          print('Experiment 16 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment14_microburst_long.py strategy2_experiment16_microburst_core_intensity.py
      - name: Run MicroBurst v3 backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment16_microburst_core_intensity.py
      - name: Commit results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e16
          for f in strategy2_experiment16_microburst_core_intensity_results.json strategy2_experiment16_microburst_core_intensity_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e16/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment16_microburst_core_intensity_results.json strategy2_experiment16_microburst_core_intensity_summary.md; do
            if [ -f "/tmp/s2e16/$f" ]; then cp "/tmp/s2e16/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record MicroBurst v3 core-intensity results"
          git push origin main
