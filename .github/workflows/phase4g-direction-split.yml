name: MarketPulse Phase 4G Direction Split

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase4g_direction_split.py'
      - 'phase4e_trend_day_backtest.py'
      - 'phase4e_results.json'
      - '.github/workflows/phase4g-direction-split.yml'

concurrency:
  group: marketpulse-phase4g
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Validate Alpaca Market Data credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          h={'APCA-API-KEY-ID':os.environ['ALPACA_API_KEY_ID'],'APCA-API-SECRET-KEY':os.environ['ALPACA_API_SECRET_KEY']}
          u='https://data.alpaca.markets/v2/stocks/QQQ/bars?timeframe=5Min&start=2026-07-01T14%3A00%3A00Z&end=2026-07-01T15%3A00%3A00Z&feed=iex&adjustment=all&limit=1'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:
              r.read(); print('Market Data API: AUTH OK',r.status)
          PY

      - name: Syntax check Phase 4G
        run: python -m py_compile phase4g_direction_split.py

      - name: Run Phase 4G historical research
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python phase4g_direction_split.py

      - name: Commit Phase 4G research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase4g_results.json phase4g_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 4G direction split research results"
            git push
          fi
