name: Strategy 2 Micro Profit-Lock Blind Backtest

on:
  push:
    branches:
      - research/blind-micro-profitlock-2026h1
    paths:
      - strategy2_micro_blind_backtest.py
      - .github/workflows/strategy2-micro-blind-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy2-micro-blind-backtest
  cancel-in-progress: false

jobs:
  blind-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout blind research branch
        uses: actions/checkout@v6
        with:
          ref: research/blind-micro-profitlock-2026h1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Verify locked blind protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('strategy2_micro_blind_backtest.py').read_text()
          assert 'TEST_START = "2026-01-02"' in s
          assert 'TEST_END = "2026-07-31"' in s
          assert 'ARM_PROFIT_PCT = 0.0035' in s
          assert 'BASE_TRAIL_PCT = 0.0010' in s
          assert 'TIGHTEN_PROFIT_PCT = 0.0075' in s
          assert 'TIGHT_TRAIL_PCT = 0.0007' in s
          assert 'EXECUTION_COST_BPS_PER_FILL = 10.0' in s
          assert 'REENTRY_COOLDOWN_SECONDS = 30' in s
          assert 'MAX_ROUND_TRIPS_PER_DAY = 200' in s
          assert 'MAX_ROUND_TRIPS_PER_SYMBOL_PER_DAY = 30' in s
          assert 'DAILY_DRAWDOWN_KILL_PCT = 0.0125' in s
          assert 'micro_beats_control_total_return' in s
          assert 'micro_drawdown_within_control_plus_1pp' in s
          assert 'core.api("POST"' not in s
          assert 'core.api("DELETE"' not in s
          assert 'submit_market' not in s
          assert 'close_position' not in s
          print('Locked blind protocol: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile strategy2_micro_blind_backtest.py

      - name: Run blind backtest once
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_micro_blind_backtest.py

      - name: Commit blind results to research branch
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          for f in strategy2_micro_blind_results.json strategy2_micro_blind_summary.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No blind result changes"
          else
            git commit -m "Record locked blind micro profit-lock results"
            git push origin HEAD:research/blind-micro-profitlock-2026h1
          fi
