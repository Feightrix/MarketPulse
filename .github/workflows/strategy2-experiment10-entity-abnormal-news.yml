name: Strategy 2 Experiment 10 Entity Abnormal News

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment10_entity_abnormal_news.py
      - .github/workflows/strategy2-experiment10-entity-abnormal-news.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment10-entity-abnormal-news
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked research protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment10_entity_abnormal_news.py').read_text()
          assert 'research_only' in s and 'broker_orders' in s and 'long_only' in s and 'leverage' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          assert 'COST_BPS_PER_FILL = 10.0' in s
          assert 'RISK_PER_TRADE_PCT = 0.0075' in s
          assert 'MAX_NOTIONAL_PCT = 0.50' in s
          assert 'MIN_MOVE_Z = 1.75' in s
          assert 'MIN_VOLUME_Z = 1.00' in s
          assert 'MIN_RS_Z = 1.25' in s
          assert 'MAX_RETRACE_FRACTION = 0.60' in s
          assert 'development_2024' in s and 'validation_2025' in s
          print('Experiment 10 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment10_entity_abnormal_news.py
      - name: Run backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment10_entity_abnormal_news.py
      - name: Commit results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e10
          for f in strategy2_experiment10_entity_abnormal_news_results.json strategy2_experiment10_entity_abnormal_news_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e10/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment10_entity_abnormal_news_results.json strategy2_experiment10_entity_abnormal_news_summary.md; do
            if [ -f "/tmp/s2e10/$f" ]; then cp "/tmp/s2e10/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record entity-abnormal news momentum results"
          git push origin main

# trigger-marker: rules unchanged
