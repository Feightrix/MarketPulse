name: MarketPulse Options Pattern 1 Backtest

on:
  push:
    branches: [main]
    paths:
      - options_pattern1_backtest.py
      - .github/workflows/options-pattern1-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-pattern1-backtest
  cancel-in-progress: false

jobs:
  backtest-pattern1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('options_pattern1_backtest.py').read_text()
          assert 'ALPACA_OPTIONS_API_KEY_ID' in s
          assert 'ALPACA_OPTIONS_SECRET_KEY' in s
          assert 'https://data.alpaca.markets' in s
          assert 'paper-api.alpaca.markets/v2/orders' not in s
          assert 'api.alpaca.markets/v2/orders' not in s
          assert 'order_submission_enabled' in s
          assert 'method="GET"' in s
          print('Options Pattern 1 research-only invariants: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile options_pattern1_backtest.py

      - name: Run Pattern 1 baseline backtest
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern1_backtest.py

      - name: Validate result file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('options_pattern1_results.json').read_text())
          assert result['order_submission_enabled'] is False
          assert result['strategy'] == 'options_pattern1_or_vwap_retest'
          assert result['complete_sessions'] > 20
          print(json.dumps(result['overall'], indent=2))
          PY

      - name: Commit Pattern 1 results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/options-pattern1
          for f in options_pattern1_results.json options_pattern1_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/options-pattern1/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern1_results.json options_pattern1_results.md; do
            if [ -f "/tmp/options-pattern1/$f" ]; then
              cp "/tmp/options-pattern1/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Pattern 1 result changes"
          else
            git commit -m "Update Options Pattern 1 baseline results"
            git push origin main
          fi
