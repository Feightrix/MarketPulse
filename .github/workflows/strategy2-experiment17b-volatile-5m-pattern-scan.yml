name: Strategy 2 Experiment 17B Volatile 5M Pattern Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment17b_volatile_5m_pattern_scan.py
      - .github/workflows/strategy2-experiment17b-volatile-5m-pattern-scan.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment17b-volatile-5m-pattern-scan
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment17b_volatile_5m_pattern_scan.py').read_text()
          assert 'EXPERIMENT = "S2-E17B-2026-VOLATILE-5M-PATTERN-SCAN"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'FEED = "sip"' in s
          assert 'TOP_VOL_NAMES = 5' in s and 'ATR_DAYS = 20' in s
          assert 'RISK_PER_TRADE = 0.01' in s and 'MAX_NOTIONAL_PCT = 1.00' in s
          assert 'COST_BPS_PER_FILL = 10.0' in s
          assert 'timeframe": "5Min"' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 17B invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py
      - name: Run scan
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment17b_volatile_5m_pattern_scan.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e17b
          for f in strategy2_experiment17b_volatile_5m_pattern_scan_results.json strategy2_experiment17b_volatile_5m_pattern_scan_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e17b/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment17b_volatile_5m_pattern_scan_results.json strategy2_experiment17b_volatile_5m_pattern_scan_summary.md; do
            if [ -f "/tmp/s2e17b/$f" ]; then cp "/tmp/s2e17b/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 2026 volatile 5-minute pattern scan results"
          git push origin main

