name: Strategy 2 Experiment 19 Runner-Day Regime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment19_runner_regime.py
      - .github/workflows/strategy2-experiment19-runner-regime.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment19-runner-regime
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment19_runner_regime.py').read_text()
          assert 'EXPERIMENT = "S2-E19-RUNNER-DAY-REGIME"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'MIN_POSITIVE_BREADTH = 3' in s
          assert 'MIN_MEDIAN_FIRST30_RETURN = 0.0025' in s
          assert 'MIN_TOP2_AVG_FIRST30_RETURN = 0.0100' in s
          assert 'MIN_QQQ_FIRST30_RETURN = -0.0035' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 19 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py strategy2_experiment18_volatile_leader_trendday.py strategy2_experiment19_runner_regime.py
      - name: Run runner-day regime backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment19_runner_regime.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e19
          for f in strategy2_experiment19_runner_regime_results.json strategy2_experiment19_runner_regime_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e19/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment19_runner_regime_results.json strategy2_experiment19_runner_regime_summary.md; do
            if [ -f "/tmp/s2e19/$f" ]; then cp "/tmp/s2e19/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record runner-day regime results"
          git push origin main

