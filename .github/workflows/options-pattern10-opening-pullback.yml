name: MarketPulse Pattern 10 Opening Pullback Research

on:
  push:
    paths:
      - 'options_pattern10_opening_pullback.py'
      - '.github/workflows/options-pattern10-opening-pullback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
      ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety gate
        run: |
          set -euo pipefail
          if grep -nE '/v2/orders|submit_order|place_order' options_pattern10_opening_pullback.py; then
            echo 'Order submission reference found; refusing research run.'
            exit 1
          fi
          grep -q 'order_submission_enabled.*False' options_pattern10_opening_pullback.py || true
      - name: Syntax check
        run: python -m py_compile options_pattern10_opening_pullback.py
      - name: Run underlying screen
        run: python options_pattern10_opening_pullback.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          p='options_pattern10_opening_pullback_results.json'
          d=json.load(open(p))
          assert d['order_submission_enabled'] is False
          assert d['reference_sessions'] >= 60
          assert len(d['results']) == 4
          print('selected:', (d.get('selected_development_candidate') or {}).get('variant',{}).get('name'))
          print('advance:', d.get('advance_to_actual_options'))
          PY
      - name: Commit results
        run: |
          git config user.name 'MarketPulse Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add options_pattern10_opening_pullback_results.json options_pattern10_opening_pullback_results.md
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Record Pattern 10 opening pullback results'
            git push
          fi
