name: MarketPulse Phase 5C Long Inverse Trend

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase5c_long_inverse_trend.py'
      - '.github/workflows/phase5c-long-inverse.yml'

concurrency:
  group: marketpulse-phase5c
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Syntax check Phase 5C
        run: python -m py_compile phase5c_long_inverse_trend.py
      - name: Run Phase 5C long-history research
        run: python phase5c_long_inverse_trend.py
      - name: Commit Phase 5C research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase5c_results.json phase5c_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 5C long inverse trend results"
            git push
          fi
