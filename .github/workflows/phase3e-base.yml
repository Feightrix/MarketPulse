name: MarketPulse Phase 3E Locked Universe Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase3e_config.json'
      - '.github/workflows/phase3e-base.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Evaluate frozen model on ETF universe
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json, pandas as pd
          import phase3d_swing_backtest as b
          cfg=json.load(open('phase3e_config.json')); u=cfg['etf_universe']; r=cfg['locked_rule']
          b.UNIVERSE=u; data=b.load_data()
          sig=(r['ranking_lookback_days'],r['breakout_lookback_days'],r['breakout_band_pct'],r['trend_mode'])
          def test(a,z,fr=5.0):
              p=b.pack(data,pd.Timestamp(a).date(),pd.Timestamp(z).date())
              return b.rounded(b.sim(p,sig,r['max_hold_days'],r['downside_boundary_pct'],r['upside_boundary_pct'],fr))
          out={'phase':'3E','purpose':'Frozen Phase 3D model evaluated on a separate ETF universe; no parameter selection.',
               'universe':u,'locked_rule':r,
               'development_2021_2023':test('2021-01-01','2023-12-31'),
               'validation_2024':test('2024-01-01','2024-12-31'),
               'validation_2025':test('2025-01-01','2025-12-31'),
               'validation_2024_2025':test('2024-01-01','2025-12-31'),
               'check_2026':test('2026-01-01','2026-07-31'),
               'friction_20bps_2024_2025':test('2024-01-01','2025-12-31',20.0)}
          json.dump(out,open('phase3e_base_results.json','w'),indent=2); print(json.dumps(out,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase3e_base_results.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update Phase 3E locked-universe results" && git push; fi
