name: Strategy 2 Experiment 10 Dev Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment10_devcheck.py
      - .github/workflows/strategy2-experiment10-devcheck.yml

permissions:
  contents: write

jobs:
  devcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify research only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment10_entity_abnormal_news.py').read_text()
          assert '/v2/orders' not in s
          assert 'paper-api.alpaca.markets' not in s
          assert 'MIN_MOVE_Z = 1.75' in s and 'MIN_VOLUME_Z = 1.00' in s and 'MIN_RS_Z = 1.25' in s
          print('Experiment 10 dev invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment10_entity_abnormal_news.py strategy2_experiment10_devcheck.py
      - name: Run 2024 development gate
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment10_devcheck.py
      - name: Commit result
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          cp strategy2_experiment10_devcheck.json /tmp/strategy2_experiment10_devcheck.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/strategy2_experiment10_devcheck.json .
          git add strategy2_experiment10_devcheck.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Experiment 10 development gate"
          git push origin main
