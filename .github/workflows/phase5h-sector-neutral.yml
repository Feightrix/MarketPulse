name: MarketPulse Phase 5H Sector Neutral Ensemble

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase5h_sector_neutral_ensemble.py'
      - '.github/workflows/phase5h-sector-neutral.yml'

concurrency:
  group: marketpulse-phase5h
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas yfinance
      - name: Syntax check Phase 5H
        run: python -m py_compile phase5h_sector_neutral_ensemble.py
      - name: Run Phase 5H historical research
        run: python phase5h_sector_neutral_ensemble.py
      - name: Commit Phase 5H research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase5h_results.json phase5h_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 5H sector-neutral ensemble results"
            git push
          fi
