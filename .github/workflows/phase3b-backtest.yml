name: MarketPulse Phase 3B Selective Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase3b_selective_backtest.py'
      - '.github/workflows/phase3b-backtest.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Validate Alpaca Market Data credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          headers={
              'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY_ID'],
              'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET_KEY'],
          }
          url='https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Day&start=2026-08-01T00%3A00%3A00Z&end=2026-08-05T00%3A00%3A00Z&feed=iex&limit=1'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              r.read()
              print(f'Market Data API: AUTH OK ({r.status})')
          PY

      - name: Run Phase 3B selective validation
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python phase3b_selective_backtest.py

      - name: Commit Phase 3B results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase3b_results.json phase3b_summary.md
          if git diff --cached --quiet; then
            echo "No Phase 3B result changes to commit"
          else
            git commit -m "Update MarketPulse Phase 3B validation results"
            git push
          fi
