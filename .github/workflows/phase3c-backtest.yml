name: MarketPulse Phase 3C Regime Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase3c_regime_backtest.py'
      - 'phase3c_regime_backtest_v2.py'
      - 'phase3c_diagnostic.py'
      - '.github/workflows/phase3c-backtest.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Validate Alpaca Market Data credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          headers={
              'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY_ID'],
              'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET_KEY'],
          }
          url='https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Day&start=2026-07-01T00%3A00%3A00Z&end=2026-07-03T00%3A00%3A00Z&feed=iex&limit=1'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers), timeout=30) as r:
              r.read()
              print('Market Data API: AUTH OK', r.status)
          PY

      - name: Diagnose Phase 3C gates
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python phase3c_diagnostic.py

      - name: Run Phase 3C regime validation
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python phase3c_regime_backtest_v2.py

      - name: Commit Phase 3C results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase3c_diagnostics.json phase3c_results.json phase3c_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 3C diagnostics and validation results"
            git push
          fi
