name: Strategy 2 Experiment 18 Volatile Leader Trend Day

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment18_volatile_leader_trendday.py
      - .github/workflows/strategy2-experiment18-volatile-leader-trendday.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment18-volatile-leader-trendday
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment18_volatile_leader_trendday.py').read_text()
          assert 'EXPERIMENT = "S2-E18-VOLATILE-LEADER-TRENDDAY"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'NONBLIND_FOLLOWUP = True' in s
          assert 'MIN_FIRST30_RETURN = 0.015' in s
          assert 'MIN_FIRST30_RELATIVE_STRENGTH = 0.0075' in s
          assert 'MIN_FIRST30_RELVOL = 1.50' in s
          assert 'MIN_CLOSE_LOCATION = 0.80' in s
          assert 'MIN_RANGE_ATR = 0.40' in s
          assert 'RISK_PER_TRADE = 0.01' in s and 'MAX_NOTIONAL_PCT = 1.00' in s
          assert 'COST_BPS_PER_FILL = 10.0' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 18 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py strategy2_experiment18_volatile_leader_trendday.py
      - name: Run trend-day backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment18_volatile_leader_trendday.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e18
          for f in strategy2_experiment18_volatile_leader_trendday_results.json strategy2_experiment18_volatile_leader_trendday_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e18/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment18_volatile_leader_trendday_results.json strategy2_experiment18_volatile_leader_trendday_summary.md; do
            if [ -f "/tmp/s2e18/$f" ]; then cp "/tmp/s2e18/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record volatile leader trend-day results"
          git push origin main
