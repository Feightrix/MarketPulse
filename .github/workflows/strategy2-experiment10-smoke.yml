name: Strategy 2 Experiment 10 Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment10_smoke.py
      - .github/workflows/strategy2-experiment10-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - run: python -m py_compile strategy2_experiment10_entity_abnormal_news.py strategy2_experiment10_smoke.py
      - name: Run diagnostic
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment10_smoke.py
      - name: Commit diagnostic
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          cp strategy2_experiment10_smoke.json /tmp/strategy2_experiment10_smoke.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/strategy2_experiment10_smoke.json .
          git add strategy2_experiment10_smoke.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Experiment 10 runtime diagnostic"
          git push origin main
