name: MarketPulse Strategy 2 Experiment 1 Risk Cap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment1_riskcap.py
      - .github/workflows/strategy2-experiment1-riskcap.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment1-riskcap
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas yfinance

      - name: Security check — research only
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('strategy2_experiment1_riskcap.py').read_text()
          assert 'CONTROL_CAP = 0.50' in s
          assert 'CANDIDATE_CAP = 0.60' in s
          assert 'RISK_CAP' in s
          assert '/v2/orders' not in s
          assert 'paper-api.alpaca.markets' not in s
          assert 'api.alpaca.markets' not in s
          print('Strategy 2 Experiment 1 research-only invariants: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile strategy2_experiment1_riskcap.py

      - name: Run Experiment 1
        run: python strategy2_experiment1_riskcap.py

      - name: Commit Experiment 1 results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e1
          for f in strategy2_experiment1_results.json strategy2_experiment1_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e1/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment1_results.json strategy2_experiment1_summary.md; do
            if [ -f "/tmp/s2e1/$f" ]; then
              cp "/tmp/s2e1/$f" "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Experiment 1 result changes"
          else
            git commit -m "Update Strategy 2 Experiment 1 results"
            git push origin main
          fi
