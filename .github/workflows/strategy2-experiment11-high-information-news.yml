name: Strategy 2 Experiment 11 High Information News

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment11_high_information_news.py
      - .github/workflows/strategy2-experiment11-high-information-news.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment11-high-information-news
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked research protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment11_high_information_news.py').read_text()
          b=Path('strategy2_experiment10_entity_abnormal_news.py').read_text()
          assert 'only_changed_variable": "catalyst_quality_filter"' in s
          assert 'BROKER_ORDERS = False' in s
          assert 'LONG_ONLY = True' in s
          assert 'LEVERAGE = False' in s
          assert '/v2/orders' not in s+b
          assert 'paper-api.alpaca.markets' not in s+b
          assert 'MIN_MOVE_Z = 1.75' in b
          assert 'MIN_VOLUME_Z = 1.00' in b
          assert 'MIN_RS_Z = 1.25' in b
          assert 'COST_BPS_PER_FILL = 10.0' in b
          assert 'RISK_PER_TRADE_PCT = 0.0075' in b
          assert 'MAX_NOTIONAL_PCT = 0.50' in b
          assert 'development_profit_factor_at_least_1_20' in s
          assert 'validation_profit_factor_at_least_1_25' in s
          print('Experiment 11 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment10_entity_abnormal_news.py strategy2_experiment11_high_information_news.py
      - name: Run backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment11_high_information_news.py
      - name: Commit results
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e11
          for f in strategy2_experiment11_high_information_news_results.json strategy2_experiment11_high_information_news_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e11/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment11_high_information_news_results.json strategy2_experiment11_high_information_news_summary.md; do
            if [ -f "/tmp/s2e11/$f" ]; then cp "/tmp/s2e11/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record high-information news filter results"
          git push origin main
