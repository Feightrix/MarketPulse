name: Strategy 2 Experiment 20 Exceptional Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - strategy2_experiment20_exceptional_runner.py
      - .github/workflows/strategy2-experiment20-exceptional-runner.yml

permissions:
  contents: write

concurrency:
  group: strategy2-experiment20-exceptional-runner
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests
      - name: Verify locked protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy2_experiment20_exceptional_runner.py').read_text()
          assert 'EXPERIMENT = "S2-E20-EXCEPTIONAL-RUNNER-OUTLIER-GATE"' in s
          assert 'BROKER_ORDERS = False' in s and 'LONG_ONLY = True' in s and 'LEVERAGE = False' in s
          assert 'MIN_RETURN_PERCENTILE = 0.90' in s
          assert 'MIN_VOLUME_PERCENTILE = 0.80' in s
          assert 'MIN_RANGE_ATR_PERCENTILE = 0.80' in s
          assert 'MIN_RELATIVE_STRENGTH = 0.010' in s
          assert 'MIN_LEADER_SEPARATION = 0.005' in s
          assert 'TARGET_MIN_FREQUENCY_PCT = 5.0' in s and 'TARGET_MAX_FREQUENCY_PCT = 15.0' in s
          assert '/v2/orders' not in s and 'paper-api.alpaca.markets' not in s
          print('Experiment 20 invariants: PASS')
          PY
      - run: python -m py_compile strategy2_experiment17b_volatile_5m_pattern_scan.py strategy2_experiment18_volatile_leader_trendday.py strategy2_experiment20_exceptional_runner.py
      - name: Run exceptional runner backtest
        env:
          ALPACA_STRATEGY2_API_KEY_ID: ${{ secrets.ALPACA_STRATEGY2_API_KEY_ID }}
          ALPACA_STRATEGY2_SECRET_KEY: ${{ secrets.ALPACA_STRATEGY2_SECRET_KEY }}
        run: python strategy2_experiment20_exceptional_runner.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/s2e20
          for f in strategy2_experiment20_exceptional_runner_results.json strategy2_experiment20_exceptional_runner_summary.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/s2e20/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in strategy2_experiment20_exceptional_runner_results.json strategy2_experiment20_exceptional_runner_summary.md; do
            if [ -f "/tmp/s2e20/$f" ]; then cp "/tmp/s2e20/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record exceptional runner outlier results"
          git push origin main

