name: MarketPulse Phase 4A Rapid Long Short Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'phase4a_research_backtest.py'
      - '.github/workflows/phase4a-research.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Validate Alpaca Market Data credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          headers={
              'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY_ID'],
              'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET_KEY'],
          }
          url='https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=1Min&start=2026-07-01T14%3A00%3A00Z&end=2026-07-01T15%3A00%3A00Z&feed=iex&adjustment=all&limit=1'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers), timeout=30) as r:
              r.read()
              print('Market Data API: AUTH OK', r.status)
          PY

      - name: Run Phase 4A historical validation
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python phase4a_research_backtest.py

      - name: Commit research outputs
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase4a_results.json phase4a_summary.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update Phase 4A historical research results"
            git push
          fi
