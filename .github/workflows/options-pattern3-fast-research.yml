name: MarketPulse Pattern 7 Cross-Sectional Momentum Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - options_pattern3_fast_research.py
      - options_pattern7_cross_sectional_momentum.py
      - .github/workflows/options-pattern3-fast-research.yml

permissions:
  contents: write

concurrency:
  group: options-pattern7-cross-sectional
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Safety gate
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern3_fast_research.py').read_text()
          p7 = Path('options_pattern7_cross_sectional_momentum.py').read_text()
          assert 'order_submission_enabled' in base
          assert 'https://data.alpaca.markets' in base
          assert 'paper-api.alpaca.markets/v2/orders' not in base + p7
          assert 'api.alpaca.markets/v2/orders' not in base + p7
          assert 'entry_i = i + 1' in p7
          assert 'MAX_DAILY_TRADES = 15' in p7
          assert 'strength_score' in p7
          print('Pattern 7 research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern3_fast_research.py
          python -m py_compile options_pattern7_cross_sectional_momentum.py

      - name: Run Pattern 7 cross-sectional momentum screen
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern7_cross_sectional_momentum.py

      - name: Validate Pattern 7 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('options_pattern7_cross_sectional_results.json').read_text())
          assert r['order_submission_enabled'] is False
          assert r['evaluation_sessions'] >= 50
          assert len(r['variants_predeclared']) == 6
          print('SELECTED', r['selected_development_candidate'])
          for k,v in r['results'].items():
              print(k, v['full'])
          PY

      - name: Commit Pattern 7 results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/p7
          for f in options_pattern7_cross_sectional_results.json options_pattern7_cross_sectional_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/p7/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern7_cross_sectional_results.json options_pattern7_cross_sectional_results.md; do
            if [ -f "/tmp/p7/$f" ]; then cp "/tmp/p7/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No Pattern 7 result changes"
          else
            git commit -m "Update Pattern 7 cross-sectional momentum results"
            git push origin main
          fi
