name: MarketPulse Pattern 3 Fast Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - options_pattern3_fast_research.py
      - .github/workflows/options-pattern3-fast-research.yml

permissions:
  contents: write

concurrency:
  group: options-pattern3-fast-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Safety gate
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('options_pattern3_fast_research.py').read_text()
          assert 'order_submission_enabled' in text
          assert 'https://data.alpaca.markets' in text
          assert 'paper-api.alpaca.markets/v2/orders' not in text
          assert 'api.alpaca.markets/v2/orders' not in text
          assert 'MAX_DAILY_TRADES = 15' in text
          assert 'VARIANTS = [' in text
          print('Pattern 3 research-only safety invariants: PASS')
          PY

      - name: Syntax check
        run: python -m py_compile options_pattern3_fast_research.py

      - name: Run Pattern 3 speed screen
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern3_fast_research.py

      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('options_pattern3_fast_results.json').read_text())
          assert r['order_submission_enabled'] is False
          assert r['strategy'] == 'options_pattern3_fast_signal_screen'
          assert r['common_sessions'] >= 40
          assert len(r['variants_predeclared']) == 6
          print('SELECTED', r['selected_development_candidate'])
          for k,v in r['results'].items():
              print(k, v['full'])
          PY

      - name: Commit results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/p3
          for f in options_pattern3_fast_results.json options_pattern3_fast_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/p3/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern3_fast_results.json options_pattern3_fast_results.md; do
            if [ -f "/tmp/p3/$f" ]; then cp "/tmp/p3/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update Pattern 3 fast research results"
            git push origin main
          fi
