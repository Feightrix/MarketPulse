name: MarketPulse Pattern 3 Fast Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - options_pattern3_fast_research.py
      - options_pattern3_fast_research_v2.py
      - options_pattern3_trend_strength.py
      - .github/workflows/options-pattern3-fast-research.yml

permissions:
  contents: write

concurrency:
  group: options-pattern3-fast-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Safety gate
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('options_pattern3_fast_research.py').read_text()
          p3b = Path('options_pattern3_trend_strength.py').read_text()
          assert 'order_submission_enabled' in base
          assert 'https://data.alpaca.markets' in base
          assert 'paper-api.alpaca.markets/v2/orders' not in base + p3b
          assert 'api.alpaca.markets/v2/orders' not in base + p3b
          assert 'entry_i = i + 1' in p3b
          assert 'LOOKBACK_DAYS = 240' in p3b
          print('Pattern 3B research-only invariants: PASS')
          PY

      - name: Syntax check
        run: |
          python -m py_compile options_pattern3_fast_research.py
          python -m py_compile options_pattern3_trend_strength.py

      - name: Run Pattern 3B trend strength screen
        env:
          ALPACA_OPTIONS_API_KEY_ID: ${{ secrets.ALPACA_OPTIONS_API_KEY_ID }}
          ALPACA_OPTIONS_SECRET_KEY: ${{ secrets.ALPACA_OPTIONS_SECRET_KEY }}
        run: python options_pattern3_trend_strength.py

      - name: Validate Pattern 3B result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('options_pattern3_trend_strength_results.json').read_text())
          assert r['order_submission_enabled'] is False
          assert r['common_sessions'] >= 80
          assert len(r['variants_predeclared']) == 6
          print('SELECTED', r['selected_development_candidate'])
          for k,v in r['results'].items():
              print(k, v['full'])
          PY

      - name: Commit Pattern 3B results
        if: always()
        run: |
          git config user.name "MarketPulse Bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/p3
          for f in options_pattern3_trend_strength_results.json options_pattern3_trend_strength_results.md; do
            if [ -f "$f" ]; then cp "$f" "/tmp/p3/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in options_pattern3_trend_strength_results.json options_pattern3_trend_strength_results.md; do
            if [ -f "/tmp/p3/$f" ]; then cp "/tmp/p3/$f" "$f"; git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No Pattern 3B result changes"
          else
            git commit -m "Update Pattern 3B trend strength results"
            git push origin main
          fi
